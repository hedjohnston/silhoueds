# fly.io deployment. See the Deploying section of README.md.
#
# Run exactly one machine: the database is a SQLite file on a single volume, so a second
# machine would get its own copy of the game.

app = "silhoueds"
primary_region = "syd"

[build]

[env]
  PORT = "3000"
  SILHOUEDS_DB = "/data/silhoueds.db"
  SILHOUEDS_UPLOADS = "/data/uploads"

[[mounts]]
  source = "silhoueds_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"
