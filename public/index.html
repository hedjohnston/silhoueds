<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- maximum-scale/user-scalable stop pinch-zoom on Android and in the installed app; iOS
       Safari ignores them by design, so the real fixes are touch-action and the 16px input. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Silhoueds</title>
  <meta name="description" content="One footballer a day, in silhouette. Six guesses, and a new hint every time you miss.">

  <!-- Link previews. %PUBLIC_URL% is substituted by the server; scrapers don't run JavaScript,
       so these have to be absolute in the HTML as served. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Silhoueds">
  <meta property="og:title" content="Silhoueds — name the footballer from their shadow">
  <meta property="og:description" content="One footballer a day, in silhouette. Six guesses, and a new hint every time you miss.">
  <meta property="og:url" content="%PUBLIC_URL%/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sansita:wght@700;800&family=Mulish:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="/favicon-64.png" sizes="64x64">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="manifest" href="/manifest.webmanifest">

  <!-- Launch without Safari chrome when opened from the iOS Home Screen. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Silhoueds">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#fcfcfc">
</head>
<body>
  <main class="card">
    <header class="header">
      <h1 class="logo">Silhoueds</h1>
      <p class="tagline">Name the footballer from their shadow.</p>
      <p class="date" id="puzzle-date"></p>
      <!-- Which puzzle and which mode used to be two pill rows sitting between the masthead and
           the puzzle — set once a round and then just spending height. A tap-in-once-a-round
           setting doesn't need to stay on screen; the summary line does the same job in one row
           and the controls themselves moved into the sheet below. -->
      <button class="link settings-trigger" id="settings-trigger" type="button">
        <span id="settings-summary"></span>
      </button>
    </header>

    <!-- The art and the input are the two things you need at the same time; the hints and the
         transcript between them are reference that grows by a row per guess. Each is docked so
         that middle scrolls under them instead of shouldering them off the screen. -->
    <div class="stage-dock">
      <div class="stage">
        <div class="silhouette" id="silhouette" role="img" aria-label="Today's silhouette"></div>
      </div>
    </div>

    <div class="hint-panel" id="hints" aria-live="polite" aria-label="Hints"></div>

    <div class="compose-dock">
      <!-- One dot per guess the round allows, filling up as they are spent. It is the transcript
           and the counter in one, which is why it sits in the dock rather than in the scrolling
           middle: six full-width pills said less than this does, and pushed everything apart. -->
      <ol class="pips" id="guess-history" aria-label="Your guesses"></ol>

      <p class="guesses-left" id="guesses-left" aria-live="polite"></p>

      <p class="notice" id="notice" role="status"></p>

      <form class="guess-form" id="guess-form" autocomplete="off">
        <div class="input-wrap">
          <label class="visually-hidden" for="guess-input">Your guess</label>
          <!-- readonly: nothing native ever pops up to type into this, on touch or desktop, so
               no platform keyboard grows the page out from under the puzzle the moment a guess
               starts. The keyboard below is what typing means now. -->
          <input
            id="guess-input"
            type="text"
            placeholder="Type a player's name…"
            readonly
            inputmode="none"
            autocomplete="off">
        </div>
        <button class="primary" type="submit">Guess</button>
      </form>

      <!-- Accent, punctuation and case are all folded away server-side (see matching.mjs), so
           letters, space and delete are the whole alphabet a guess ever needs. A physical
           keyboard still works — its keystrokes land through the same two functions in game.js —
           this exists for touch, not instead of it. -->
      <div class="keyboard" id="keyboard" role="group" aria-label="On-screen keyboard">
        <div class="keyboard-row">
          <button class="key" type="button" data-key="Q">Q</button>
          <button class="key" type="button" data-key="W">W</button>
          <button class="key" type="button" data-key="E">E</button>
          <button class="key" type="button" data-key="R">R</button>
          <button class="key" type="button" data-key="T">T</button>
          <button class="key" type="button" data-key="Y">Y</button>
          <button class="key" type="button" data-key="U">U</button>
          <button class="key" type="button" data-key="I">I</button>
          <button class="key" type="button" data-key="O">O</button>
          <button class="key" type="button" data-key="P">P</button>
        </div>
        <div class="keyboard-row">
          <button class="key" type="button" data-key="A">A</button>
          <button class="key" type="button" data-key="S">S</button>
          <button class="key" type="button" data-key="D">D</button>
          <button class="key" type="button" data-key="F">F</button>
          <button class="key" type="button" data-key="G">G</button>
          <button class="key" type="button" data-key="H">H</button>
          <button class="key" type="button" data-key="J">J</button>
          <button class="key" type="button" data-key="K">K</button>
          <button class="key" type="button" data-key="L">L</button>
        </div>
        <div class="keyboard-row">
          <button class="key" type="button" data-key="Z">Z</button>
          <button class="key" type="button" data-key="X">X</button>
          <button class="key" type="button" data-key="C">C</button>
          <button class="key" type="button" data-key="V">V</button>
          <button class="key" type="button" data-key="B">B</button>
          <button class="key" type="button" data-key="N">N</button>
          <button class="key" type="button" data-key="M">M</button>
          <button class="key key-backspace" type="button" data-key="Backspace" aria-label="Backspace">⌫</button>
        </div>
        <div class="keyboard-row">
          <button class="key key-skip" id="skip-button" type="button">Skip</button>
          <button class="key key-space" type="button" data-key=" ">Space</button>
        </div>
      </div>
    </div>

    <section class="result" id="result" hidden aria-live="polite">
      <h2 class="result-title" id="result-title"></h2>
      <p class="result-name" id="result-name"></p>
      <button class="primary share-button" type="button">Share result</button>
      <p class="share-status" aria-live="polite"></p>
      <div class="stats" id="stats"></div>
      <p class="comeback" id="comeback"></p>
      <button class="primary share-button" type="button">Share result</button>
      <p class="share-status" aria-live="polite"></p>
    </section>

    <nav class="footer-nav">
      <button class="link" id="stats-button" type="button">Your stats</button>
      <button class="link" id="archive-button" type="button">Past puzzles</button>
    </nav>

    <dialog class="sheet" id="sheet">
      <form method="dialog" class="sheet-close"><button aria-label="Close">✕</button></form>
      <h2 class="sheet-title" id="sheet-title"></h2>
      <div id="sheet-body"></div>
    </dialog>

    <!-- A separate dialog rather than the generic one above: showStats/showArchive empty and
         refill #sheet-body from scratch on every open, which would tear down these buttons and
         the listeners game.js already attached to them once at init. -->
    <dialog class="sheet" id="settings-sheet">
      <form method="dialog" class="sheet-close"><button aria-label="Close">✕</button></form>
      <h2 class="sheet-title">Puzzle settings</h2>

      <div class="modes" id="categories" role="group" aria-label="Category">
        <button class="mode" id="category-pl" type="button" data-category="premier-league" aria-pressed="false">Premier League</button>
        <button class="mode" id="category-intl" type="button" data-category="international" aria-pressed="true">The Rest</button>
      </div>

      <div class="modes" id="modes" role="group" aria-label="Difficulty">
        <button class="mode" id="mode-hard" type="button" data-mode="hard" aria-pressed="true">Hard</button>
        <button class="mode" id="mode-easy" type="button" data-mode="easy" aria-pressed="false">Easy</button>
      </div>
      <p class="mode-note" id="mode-note"></p>
    </dialog>
  </main>

  <script type="module" src="game.js"></script>
</body>
</html>
