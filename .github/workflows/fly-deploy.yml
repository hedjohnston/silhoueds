# Deploy to Fly.io on every push to main.
#
# Needs one repository secret, FLY_API_TOKEN. Mint a token scoped to deploying just this app:
#
#   fly tokens create deploy -a <your-app-name>
#
# then add it at Settings -> Secrets and variables -> Actions -> New repository secret.

name: Deploy

on:
  push:
    branches: [main]
  # Also runnable by hand from the Actions tab, for a redeploy without a code change.
  workflow_dispatch:

# A push while a deploy is running supersedes it, rather than racing it. Deploys in progress are
# allowed to finish, since cancelling one midway can leave the app part-updated.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # The gate. Without this a syntax error reaches production and is only caught by the health
  # check, after the machine has already been replaced.
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the engines floor in package.json — node:sqlite and node:test are built in.
          node-version: '22.x'

      - run: npm ci
      - run: npm test

  deploy:
    name: Deploy to Fly.io
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
